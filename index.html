<!DOCTYPE html>
<html>
<head>
<title>WHITE//LINE SOCIETY</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial;
    text-align: center;
}

/* ================= BOOT SCREEN ================= */
#boot {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.logo {
    font-size: 28px;
    letter-spacing: 4px;
    color: #00ffc3;
}

.sub {
    margin-top: 10px;
    opacity: 0.7;
}

.bar {
    width: 300px;
    height: 10px;
    border: 1px solid #00ffc3;
    margin-top: 20px;
}

.fill {
    height: 100%;
    width: 0%;
    background: #00ffc3;
    animation: load 3s forwards;
}

@keyframes load {
    0% { width: 0%; }
    100% { width: 100%; }
}

#status {
    margin-top: 15px;
    font-size: 12px;
    opacity: 0.6;
}

/* ================= MAIN ================= */
#app {
    display: none;
}

.box {
    border: 1px solid white;
    margin: 20px;
    padding: 20px;
    border-radius: 10px;
}

button {
    margin: 5px;
    padding: 10px;
    cursor: pointer;
}

#garage {
    display: none;
}

video {
    width: 80%;
    margin-top: 10px;
    border-radius: 10px;
}
</style>

</head>

<body>

<!-- BOOT -->
<div id="boot">
    <div class="logo">WHITE//LINE SOCIETY</div>
    <div class="sub">SYSTEM BOOTING...</div>

    <div class="bar">
        <div class="fill"></div>
    </div>

    <div id="status">Initializing...</div>
</div>

<!-- MAIN -->
<div id="app">

    <h1>🏁 WHITE//LINE SOCIETY</h1>

    <!-- PROM -->
    <div class="box">
        <h2>🤵🏻 PROM</h2>
        <div id="prom"></div>
        <p>Big night. Cars, friends, memories.</p>
    </div>

    <!-- RACE -->
    <div class="box">
        <h2>🏁 RACE DAY</h2>
        <div id="race">WAITING...</div>
        <p id="raceDesc">Waiting for race date.</p>

        <button onclick="setRace()">Set Date</button>
        <button onclick="setRaceDesc()">Edit Description</button>
    </div>

    <!-- GARAGE -->
    <div class="box">
        <h2>🔒 GARAGE VAULT 😎</h2>
        <button onclick="openGarage()">Click HERE</button>

        <div id="garage">
            <video controls src="video1.mp4"></video>
            <video controls src="video2.mp4"></video>
        </div>
    </div>

</div>

<script>

// PROM
let promDate = new Date("June 1, 2026 18:00:00").getTime();

// RACE
let raceDate = localStorage.getItem("raceDate");
let raceDesc = localStorage.getItem("raceDesc") || "Waiting for race date.";

// PASSWORD
const PASSWORD = "1234";

// BOOT
const messages = [
    "Initializing systems...",
    "Loading WHITE//LINE modules...",
    "Mounting garage vault...",
    "Syncing timeline...",
    "Ready."
];

let i = 0;

function bootSequence() {
    let status = document.getElementById("status");

    let interval = setInterval(() => {
        status.innerText = messages[i];
        i++;

        if (i >= messages.length) {
            clearInterval(interval);
            setTimeout(() => {
                document.getElementById("boot").style.display = "none";
                document.getElementById("app").style.display = "block";
            }, 500);
        }
    }, 600);
}

// LOOP
setInterval(() => {
    let now = Date.now();

    document.getElementById("prom").innerText =
        format(promDate - now);

    if (raceDate) {
        document.getElementById("race").innerText =
            format(raceDate - now);
    }

    document.getElementById("raceDesc").innerText = raceDesc;

}, 1000);

// FORMAT
function format(ms) {
    if (ms <= 0) return "STARTED";

    let d = Math.floor(ms / 86400000);
    let h = Math.floor(ms / 3600000) % 24;
    let m = Math.floor(ms / 60000) % 60;
    let s = Math.floor(ms / 1000) % 60;

    return `${d}d ${h}h ${m}m ${s}s`;
}

// RACE SET
function setRace() {
    let input = prompt("YYYY-MM-DD HH:MM");
    if (!input) return;

    raceDate = new Date(input).getTime();
    localStorage.setItem("raceDate", raceDate);
}

// DESCRIPTION
function setRaceDesc() {
    let input = prompt("Describe race:");
    if (!input) return;

    raceDesc = input;
    localStorage.setItem("raceDesc", raceDesc);
}

// GARAGE
function openGarage() {
    let pass = prompt("Password:");
    if (pass === PASSWORD) {
        document.getElementById("garage").style.display = "block";
    } else {
        alert("Wrong password");
    }
}

// START
bootSequence();

</script>

</body>
</html>
